# 🎹 Audio → MIDI extraction (basic-pitch, polyphonic)
# 사용법: Actions 탭 → "Extract MIDI" → Run workflow → URL 입력
# 결과: Artifact로 MIDI 다운로드

name: Extract MIDI

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL (또는 비워두면 pipelines/audio/input.mp3 사용)'
        required: false
        default: ''
      onset_threshold:
        description: 'Note onset threshold (0.1~0.9, 낮을수록 음 많이 잡음)'
        required: false
        default: '0.5'
      min_note_len:
        description: '최소 음 길이 (초)'
        required: false
        default: '0.1'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y ffmpeg
          pip install yt-dlp basic-pitch pretty_midi librosa

      - name: Download audio
        run: |
          mkdir -p pipelines/audio
          INPUT="${{ github.event.inputs.youtube_url }}"
          if [ -n "$INPUT" ]; then
            if echo "$INPUT" | grep -q '^https://github.com/.*releases/download/'; then
              echo "📥 GitHub Release → MP3"
              curl -sL -o pipelines/audio/input.mp3 "$INPUT"
            else
              echo "📥 YouTube → WAV"
              yt-dlp -x --audio-format wav --audio-quality 0 \
                -o "pipelines/audio/input.%(ext)s" \
                "$INPUT" || { echo "⚠️ yt-dlp failed, trying direct download..."; exit 1; }
            fi
          elif [ -f pipelines/audio/input.mp3 ]; then
            echo "✅ pipelines/audio/input.mp3 사용"
          elif [ -f pipelines/audio/input.wav ]; then
            echo "✅ pipelines/audio/input.wav 사용"
          else
            echo "❌ URL도 없고 pipelines/audio/input.* 도 없음"
            exit 1
          fi
          ls -lah pipelines/audio/

      - name: Extract MIDI (basic-pitch)
        run: |
          python3 << 'PYEOF'
          import os, subprocess, glob
          from basic_pitch.inference import predict
          from basic_pitch import ICASSP_2022_MODEL_PATH
          import pretty_midi
          import numpy as np
          import soundfile as sf
          import librosa

          # Find input audio
          audio_files = glob.glob('pipelines/audio/input.*')
          if not audio_files:
              print("❌ No input audio found")
              exit(1)
          input_audio = audio_files[0]
          output_mid = 'pipelines/audio/output.mid'

          print(f"📥 Loading: {input_audio}")

          # basic-pitch needs .wav at the right sample rate
          y, sr = librosa.load(input_audio, sr=22050, mono=True)
          tmp_wav = 'pipelines/audio/_input_22k.wav'
          sf.write(tmp_wav, y, sr)
          print(f"   Resampled: {len(y)/sr:.1f}s, {sr}Hz")

          print("🎹 basic-pitch MIDI extraction...")
          model_output, midi_data, note_events = predict(
              tmp_wav,
              model_path=ICASSP_2022_MODEL_PATH,
              onset_threshold=float(os.environ.get('ONSET_THRESHOLD', '0.45')),
              minimum_note_length=float(os.environ.get('MIN_NOTE_LEN', '0.08')),
              minimum_frequency=50,
              maximum_frequency=4000,
          )

          midi_data.write(output_mid)
          print(f"✅ {output_mid}")
          print(f"   Notes: {len(note_events)}")
          print(f"   Duration: {midi_data.get_end_time():.1f}s")

          for i, note in enumerate(note_events[:10]):
              print(f"   Note {i}: pitch={note[1]}, vel={note[2]}, start={note[0]:.2f}, end={note[3]:.2f}")
          if len(note_events) > 10:
              print(f"   ... and {len(note_events) - 10} more notes")
          PYEOF
        env:
          ONSET_THRESHOLD: ${{ github.event.inputs.onset_threshold }}
          MIN_NOTE_LEN: ${{ github.event.inputs.min_note_len }}

      - name: Upload MIDI
        uses: actions/upload-artifact@v4
        with:
          name: extracted-midi
          path: pipelines/audio/output.mid

      - name: Commit MIDI to repo
        run: |
          cp pipelines/audio/output.mid pipelines/audio/extracted.mid
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add pipelines/audio/extracted.mid
          git diff --staged --quiet || git commit -m "midi: extract from YouTube [skip ci]"
          git push
