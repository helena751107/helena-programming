# 🎹 Audio → MIDI extraction (basic-pitch, polyphonic)
# 사용법: Actions 탭 → "Extract MIDI" → Run workflow → URL 입력
# 결과: Artifact로 MIDI 다운로드

name: Extract MIDI

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL (또는 비워두면 pipelines/audio/input.mp3 사용)'
        required: false
        default: ''
      onset_threshold:
        description: 'Note onset threshold (0.1~0.9, 낮을수록 음 많이 잡음)'
        required: false
        default: '0.5'
      min_note_len:
        description: '최소 음 길이 (초)'
        required: false
        default: '0.1'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y ffmpeg
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "librosa<0.10" yt-dlp pretty_midi soundfile
          pip install piano_transcription_inference

      - name: Download audio
        run: |
          mkdir -p pipelines/audio
          INPUT="${{ github.event.inputs.youtube_url }}"
          if [ -n "$INPUT" ]; then
            if echo "$INPUT" | grep -q '^https://github.com/.*releases/download/'; then
              echo "📥 GitHub Release → MP3"
              curl -sL -o pipelines/audio/input.mp3 "$INPUT"
            else
              echo "📥 YouTube → WAV"
              yt-dlp -x --audio-format wav --audio-quality 0 \
                -o "pipelines/audio/input.%(ext)s" \
                "$INPUT" || { echo "⚠️ yt-dlp failed, trying direct download..."; exit 1; }
            fi
          elif [ -f pipelines/audio/input.mp3 ]; then
            echo "✅ pipelines/audio/input.mp3 사용"
          elif [ -f pipelines/audio/input.wav ]; then
            echo "✅ pipelines/audio/input.wav 사용"
          else
            echo "❌ URL도 없고 pipelines/audio/input.* 도 없음"
            exit 1
          fi
          ls -lah pipelines/audio/

      - name: Extract MIDI (piano_transcription)
        run: |
          python3 -c '
          import os, sys, glob, traceback
          try:
              import soundfile as sf, pretty_midi, numpy as np, librosa
              from piano_transcription_inference import PianoTranscription, sample_rate

              audio_files = glob.glob("pipelines/audio/input.*")
              if not audio_files: print("❌ No input"); sys.exit(1)
              input_audio = audio_files[0]
              output_mid = "pipelines/audio/output.mid"

              # Load audio with soundfile (bypass librosa version issues)
              y, sr = sf.read(input_audio, dtype="float32", always_2d=False)
              if y.ndim > 1: y = y.mean(axis=1)
              if sr != sample_rate:
                  y = librosa.resample(y, orig_sr=sr, target_sr=sample_rate)
              print(f"📥 Loaded: {len(y)/sample_rate:.1f}s, {sample_rate}Hz")

              print("🎹 piano_transcription (ByteDance SOTA)...")
              sys.stdout.flush()
              transcriber = PianoTranscription(device="cpu")
              trans_dict = transcriber.transcribe(y, output_mid)

              midi = pretty_midi.PrettyMIDI(output_mid)
              notes = midi.instruments[0].notes if midi.instruments else []
              print(f"✅ {output_mid}  Notes: {len(notes)}  Dur: {midi.get_end_time():.1f}s")

              # Filter + 60s best clip
              min_dur = float(os.environ.get("MIN_NOTE_LEN", "0.08"))
              good = [n for n in notes if n.velocity >= 30 and (n.end-n.start) >= min_dur]
              seg = {}
              for n in good: s = int(n.start/10)*10; seg[s] = seg.get(s, 0) + 1
              best = max(seg, key=seg.get) if seg else 0
              clip_notes = []
              for n in good:
                  t = n.start - best
                  if 0 <= t <= 60:
                      n.start = t; n.end = min(t+(n.end-n.start), 60)
                      clip_notes.append(n)
              clip = pretty_midi.PrettyMIDI()
              clip.instruments.append(pretty_midi.Instrument(program=0, name="Piano"))
              clip.instruments[0].notes = clip_notes
              clip_path = "pipelines/audio/output_clean.mid"
              clip.write(clip_path)
              print(f"   Clean: {len(clip_notes)} notes in 60s ({best}s~{best+60}s)")
              print(f"   Velocities: {np.mean([n.velocity for n in clip_notes]):.0f} avg")
          except Exception as e:
              traceback.print_exc(); print(f"❌ {e}"); sys.exit(1)
          '
        env:
          ONSET_THRESHOLD: ${{ github.event.inputs.onset_threshold }}
          MIN_NOTE_LEN: ${{ github.event.inputs.min_note_len }}

      - name: Upload MIDI
        uses: actions/upload-artifact@v4
        with:
          name: extracted-midi
          path: |
            pipelines/audio/output.mid
            pipelines/audio/output_clean.mid

      - name: Commit MIDI to repo
        run: |
          cp pipelines/audio/output.mid pipelines/audio/extracted.mid
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add pipelines/audio/extracted.mid
          git diff --staged --quiet || git commit -m "midi: extract from YouTube [skip ci]"
          git push
