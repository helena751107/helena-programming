<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="웹페이지 URL → TTS + Canvas → 영상 생성 + 클립 이어붙이기. S21 단독, 0원.">
<title>Helena Studio — 웹페이지→영상 + 이어붙이기</title>
<link rel="manifest" href="manifest.json">
<style>
:root { --bg:#0f172a; --surface:#1e293b; --border:#334155; --text:#e2e8f0;
  --muted:#64748b; --accent:#6366f1; --accent2:#818cf8; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:2rem; }
.hidden { display:none !important; }

.header { text-align:center; padding:1.5rem 1rem .5rem; }
.header h1 { font-size:1.4rem; }
.header h1 span { color:var(--accent2); }
.header p { color:var(--muted); font-size:.8rem; margin-top:.2rem; }

/* 탭 */
.tabs { display:flex; gap:.25rem; margin:1rem 1rem 0; max-width:600px; margin-left:auto; margin-right:auto; }
.tab { flex:1; padding:.6rem; text-align:center; cursor:pointer; border-radius:10px 10px 0 0;
  font-size:.8rem; font-weight:600; background:var(--surface); color:var(--muted);
  border:1px solid var(--border); border-bottom:none; transition:all .2s; }
.tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

.card { background:var(--surface); border:1px solid var(--border); border-radius:0 0 12px 12px;
  padding:1.25rem; margin:0 1rem 1rem; max-width:600px; margin-left:auto; margin-right:auto; }
.card.standalone { border-radius:12px; }
.card h3 { font-size:.85rem; margin-bottom:.75rem; color:var(--accent2); }

input, textarea, select { width:100%; background:var(--bg); border:1px solid var(--border);
  color:var(--text); padding:.7rem; border-radius:8px; font-size:.85rem; margin-bottom:.5rem; }
input:focus, textarea:focus { border-color:var(--accent2); outline:none; }
textarea { resize:vertical; min-height:60px; }

.btn { padding:.7rem 1.2rem; border:none; border-radius:10px; cursor:pointer;
  font-size:.85rem; font-weight:700; transition:all .2s; }
.btn:active { transform:scale(.97); }
.btn-primary { background:var(--accent); color:#fff; width:100%; }
.btn-primary:disabled { opacity:.4; }
.btn-sm { padding:.4rem .8rem; font-size:.75rem; border-radius:6px; }
.btn-outline { background:transparent; color:var(--accent2); border:1px solid var(--accent2); }
.btn-danger { background:#dc2626; color:#fff; }
.btn-success { background:#16a34a; color:#fff; width:100%; }

/* 클립 리스트 */
.clip-list { display:flex; flex-direction:column; gap:.4rem; min-height:40px; }
.clip-item { display:flex; align-items:center; gap:.5rem; padding:.6rem;
  background:var(--bg); border-radius:8px; border:1px solid var(--border); font-size:.8rem; }
.clip-num { color:var(--accent2); font-weight:700; min-width:1.2rem; font-size:.75rem; }
.clip-url { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
.clip-status { font-size:.7rem; min-width:3rem; text-align:right; }
.clip-status.done { color:#4ade80; }
.clip-status.wait { color:var(--muted); }
.clip-actions { display:flex; gap:2px; }
.clip-actions button { background:none; border:none; color:var(--muted); cursor:pointer;
  padding:2px 4px; font-size:.7rem; border-radius:3px; }
.clip-actions button:hover { color:var(--text); }

/* Add URL row */
.add-row { display:flex; gap:.4rem; margin-bottom:.5rem; }
.add-row input { flex:1; margin-bottom:0; }
.add-row button { flex-shrink:0; }

/* Voice */
.voice-row { display:flex; gap:.4rem; margin-bottom:.5rem; }
.voice-row select { margin-bottom:0; }

/* Progress */
.progress-section { margin:0 1rem .5rem; max-width:600px; margin-left:auto; margin-right:auto; }
.progress-bar { height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
.progress-fill { height:100%; background:var(--accent); width:0%; transition:width .3s; }
.progress-text { font-size:.75rem; color:var(--muted); margin-top:.2rem; }

/* Preview */
.preview { margin:0 1rem 1rem; max-width:600px; margin-left:auto; margin-right:auto;
  background:var(--surface); border-radius:12px; overflow:hidden; border:1px solid var(--border); }
.preview video { width:100%; display:block; }
.preview .bar { padding:.6rem; display:flex; justify-content:space-between; align-items:center; font-size:.8rem; }
.preview .bar span { color:var(--muted); }

/* Log */
.log { margin:0 1rem; max-width:600px; margin-left:auto; margin-right:auto;
  font-size:.7rem; color:var(--muted); max-height:120px; overflow-y:auto; }
.log .ok { color:#4ade80; }
.log .err { color:#f87171; }
.log .i { color:#60a5fa; }
</style>
</head>
<body>

<div class="header">
  <h1>🎬 Helena <span>Studio</span></h1>
  <p>웹페이지 → 영상 생성 + 클립 이어붙이기 · S21 · 0원</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('generate')">🎥 영상 생성</button>
  <button class="tab" onclick="switchTab('stitch')">🔗 클립 이어붙이기</button>
</div>

<!-- ════════════════════════════════════════════════════  TAB: GENERATE  ═══ -->
<div id="tab-generate">
  <div class="card">
    <h3>🌐 웹페이지 URL</h3>
    <input type="url" id="genUrl" placeholder="https://helena751107.github.io/helena-piano/"
           value="https://helena751107.github.io/helena-piano/">
    <div style="display:flex;gap:.5rem;align-items:center;margin-bottom:.25rem;">
      <select id="genVoice" style="margin-bottom:0;"></select>
    </div>
  </div>
  <div class="card standalone">
    <h3>🎬 생성</h3>
    <button class="btn btn-primary" id="genBtn" onclick="generateOne()">영상 생성</button>
  </div>
</div>

<!-- ════════════════════════════════════════════════════  TAB: STITCH  ═══ -->
<div id="tab-stitch" class="hidden">
  <div class="card">
    <h3>➕ 클립 추가 (URL 여러 개)</h3>
    <div class="add-row">
      <input type="url" id="stitchUrl" placeholder="https://... 새 클립 URL">
      <button class="btn btn-sm btn-outline" onclick="addClip()">+ 추가</button>
    </div>
    <div class="clip-list" id="clipList">
      <div style="color:var(--muted);font-size:.8rem;text-align:center;padding:.5rem;">
        URL을 추가하세요
      </div>
    </div>
  </div>

  <div class="card">
    <h3>🎙️ TTS 음성</h3>
    <select id="stitchVoice" style="margin-bottom:0;"></select>
  </div>

  <div class="card standalone">
    <h3>🔗 모두 이어붙이기</h3>
    <button class="btn btn-success" id="stitchBtn" onclick="stitchAll()" disabled>
      영상 이어붙이기 (<span id="clipCount">0</span>개 클립)
    </button>
  </div>
</div>

<!-- Progress + Preview + Log (shared) -->
<div class="progress-section hidden" id="progressSection">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText"></div>
</div>

<div class="preview hidden" id="previewSection">
  <video id="previewVideo" controls></video>
  <div class="bar">
    <span id="previewInfo"></span>
    <button class="btn btn-sm btn-outline" onclick="downloadVideo()">📥 다운로드</button>
  </div>
</div>

<div class="log" id="log"></div>

<script>
// ── STATE ──
const S = {
  mode: 'generate',
  voices: [],
  voiceIdx: 0,
  clips: [],        // {url, title, status:'wait'|'done', blob, url_blob}
  resultBlob: null,
  resultUrl: null
};

// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
  loadVoices();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
});

function switchTab(m) {
  S.mode = m;
  document.querySelectorAll('.tab').forEach((t,i) =>
    t.classList.toggle('active', (i===0 && m==='generate') || (i===1 && m==='stitch')));
  document.getElementById('tab-generate').classList.toggle('hidden', m !== 'generate');
  document.getElementById('tab-stitch').classList.toggle('hidden', m !== 'stitch');
}

// ── VOICES ──
function loadVoices() {
  const s = window.speechSynthesis;
  const load = () => {
    S.voices = s.getVoices().filter(v => v.lang.startsWith('ko'));
    if (!S.voices.length) S.voices = s.getVoices();
    S.voiceIdx = 0;
    renderVoiceSelects();
  };
  load();
  s.onvoiceschanged = load;
}

function renderVoiceSelects() {
  const html = S.voices.map((v,i) =>
    `<option value="${i}" ${i===S.voiceIdx?'selected':''}>${v.name} (${v.lang})</option>`).join('');
  document.getElementById('genVoice').innerHTML = html;
  document.getElementById('stitchVoice').innerHTML = html;

  document.getElementById('genVoice').onchange = e => S.voiceIdx = +e.target.value;
  document.getElementById('stitchVoice').onchange = e => S.voiceIdx = +e.target.value;
}

// ── LOG ──
function log(msg, cls='') {
  const t = new Date().toLocaleTimeString();
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${cls}">[${t}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}
function setProgress(pct, msg) {
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressText').textContent = msg || '';
}

// ── CANVAS RENDER ──
function renderFrame(ctx, title, body, num, total) {
  const W=720, H=1280;
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0f172a'); grad.addColorStop(0.5,'#1e1a3a'); grad.addColorStop(1,'#0f172a');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#1e293b'; ctx.fillRect(50,H-50,W-100,3);
  ctx.fillStyle = '#6366f1'; ctx.fillRect(50,H-50,(W-100)*num/total,3);

  ctx.fillStyle = '#475569'; ctx.font='12px system-ui'; ctx.fillText('HELENA STUDIO',W-160,50);
  ctx.fillStyle = '#6366f1'; ctx.font='14px system-ui'; ctx.fillText(`SECTION ${num}/${total}`,50,130);

  ctx.fillStyle = '#f8fafc'; ctx.font='bold 36px system-ui';
  const tl = wrap(ctx, title, W-100);
  tl.forEach((l,i) => ctx.fillText(l, 50, 200+i*50));

  ctx.fillStyle = '#cbd5e1'; ctx.font='22px system-ui';
  const bl = wrap(ctx, body, W-100);
  const sy = 200+tl.length*50+60;
  bl.slice(0,10).forEach((l,i) => { if(sy+i*36<H-100) ctx.fillText(l, 50, sy+i*36); });

  ctx.strokeStyle = '#6366f1'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(50,170+tl.length*50); ctx.lineTo(W-50,170+tl.length*50); ctx.stroke();
}

function wrap(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) {
    const t = line ? line+' '+w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

function speakText(text, voice) {
  return new Promise(resolve => {
    if (!window.speechSynthesis) { setTimeout(resolve, text.length*60); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice; u.rate = 0.95; u.pitch = 1; u.volume = 1;
    u.onend = () => resolve();
    u.onerror = () => resolve();
    window.speechSynthesis.speak(u);
  });
}

// ── EXTRACT ──
function extractContent(html) {
  const d = document.createElement('div'); d.innerHTML = html;
  d.querySelectorAll('script,style,nav,footer,code,pre').forEach(e => e.remove());
  return d.textContent || '';
}

function splitSections(text) {
  const clean = text.replace(/\s+/g,' ').trim();
  const secs = [];
  const hSplit = clean.split(/(?:^|\n)\s*#{1,3}\s+(.+?)(?:\n|$)/);
  if (hSplit.length>1) {
    for (let i=1; i<hSplit.length; i+=2) {
      const body = (hSplit[i+1]||'').trim();
      if (body.length>5) secs.push({title:hSplit[i].trim(), body:body.substring(0,400)});
    }
  }
  if (!secs.length) {
    const sents = clean.split(/[.。!?！？\n]+/).filter(s=>s.trim().length>5);
    for (let i=0; i<Math.min(sents.length,15); i+=3) {
      secs.push({title:`Part ${Math.floor(i/3)+1}`, body:sents.slice(i,i+3).join('. ').substring(0,400)});
    }
  }
  return secs.slice(0,10);
}

// ── GENERATE ONE ──
async function generateOne() {
  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.textContent = '⏳ 생성 중...';
  document.getElementById('previewSection').classList.add('hidden');
  document.getElementById('progressSection').classList.remove('hidden');
  document.getElementById('log').innerHTML = '';

  try {
    const url = document.getElementById('genUrl').value.trim();
    if (!url) throw new Error('URL 입력');

    setProgress(5, '가져오는 중...');
    log(`🌐 ${url}`, 'i');
    const html = await fetch(url).then(r=>r.text());
    const content = extractContent(html);
    const sections = splitSections(content);
    log(`📝 ${content.length}자 → ${sections.length}섹션`, 'ok');

    const voice = S.voices[S.voiceIdx] || null;
    const canvas = document.createElement('canvas'); canvas.width=720; canvas.height=1280;
    const ctx = canvas.getContext('2d');
    const stream = canvas.captureStream(30);
    const chunks = [];
    const rec = new MediaRecorder(stream, {mimeType:'video/webm;codecs=vp9'});
    rec.ondataavailable = e => chunks.push(e.data);
    rec.start();

    for (let i=0; i<sections.length; i++) {
      const s = sections[i], pct = 10 + Math.floor(80*(i+1)/sections.length);
      setProgress(pct, `[${i+1}/${sections.length}] ${s.title.substring(0,35)}`);
      log(`🎬 [${i+1}/${sections.length}] ${s.title.substring(0,35)}`, 'i');
      renderFrame(ctx, s.title, s.body, i+1, sections.length);
      await speakText(`${s.title}. ${s.body}`, voice);
    }

    renderFrame(ctx, '완료', `Helena Studio · ${sections.length}섹션`, sections.length, sections.length);
    await new Promise(r=>setTimeout(r,1500));
    rec.stop();

    await new Promise(resolve => { rec.onstop = () => {
      S.resultBlob = new Blob(chunks,{type:'video/webm'});
      S.resultUrl = URL.createObjectURL(S.resultBlob);
      resolve();
    }});

    setProgress(100, '완료!');
    log(`✅ ${(S.resultBlob.size/1024/1024).toFixed(1)}MB`, 'ok');
    showPreview(sections.length);

  } catch(e) { log(`❌ ${e.message}`, 'err'); setProgress(0, e.message); }

  btn.disabled = false; btn.textContent = '영상 생성';
}

// ── STITCH: CLIP MANAGEMENT ──
function addClip() {
  const input = document.getElementById('stitchUrl');
  const url = input.value.trim();
  if (!url) return;
  S.clips.push({url, title:url.split('/').pop()||url, status:'wait', blob:null, url_blob:null});
  input.value = '';
  renderClips();
}

function removeClip(i) { S.clips.splice(i,1); renderClips(); }
function moveClip(i, dir) {
  const j = i+dir;
  if (j<0||j>=S.clips.length) return;
  [S.clips[i], S.clips[j]] = [S.clips[j], S.clips[i]];
  renderClips();
}

function renderClips() {
  const list = document.getElementById('clipList');
  if (!S.clips.length) {
    list.innerHTML = '<div style="color:var(--muted);font-size:.8rem;text-align:center;padding:.5rem;">URL을 추가하세요</div>';
  } else {
    list.innerHTML = S.clips.map((c,i) => `
      <div class="clip-item">
        <span class="clip-num">${i+1}</span>
        <span class="clip-url">${c.url.substring(0,50)}</span>
        <span class="clip-status ${c.status}">${c.status==='done'?'✅':'⏳'}</span>
        <div class="clip-actions">
          <button onclick="moveClip(${i},-1)" ${i===0?'disabled':''}>▲</button>
          <button onclick="moveClip(${i},1)" ${i===S.clips.length-1?'disabled':''}>▼</button>
          <button onclick="removeClip(${i})" style="color:#f87171">✕</button>
        </div>
      </div>`).join('');
  }
  updateStitchBtn();
}

function updateStitchBtn() {
  const btn = document.getElementById('stitchBtn');
  const cnt = document.getElementById('clipCount');
  cnt.textContent = S.clips.length;
  btn.disabled = S.clips.length < 2;
}

// ── STITCH ALL ──
async function stitchAll() {
  if (S.clips.length < 2) return;
  const btn = document.getElementById('stitchBtn');
  btn.disabled = true; btn.textContent = '⏳ 이어붙이는 중...';
  document.getElementById('previewSection').classList.add('hidden');
  document.getElementById('progressSection').classList.remove('hidden');
  document.getElementById('log').innerHTML = '';

  try {
    const voice = S.voices[S.voiceIdx] || null;
    const canvas = document.createElement('canvas'); canvas.width=720; canvas.height=1280;
    const ctx = canvas.getContext('2d');
    const stream = canvas.captureStream(30);
    const chunks = [];
    const rec = new MediaRecorder(stream, {mimeType:'video/webm;codecs=vp9'});
    rec.ondataavailable = e => chunks.push(e.data);
    rec.start();

    let totalSections = 0;
    // First pass: get section counts for progress
    const allSections = [];
    for (const clip of S.clips) {
      const html = await fetch(clip.url).then(r=>r.text());
      const content = extractContent(html);
      const secs = splitSections(content);
      allSections.push({clip, secs});
      totalSections += secs.length;
    }

    let done = 0;
    for (const {clip, secs} of allSections) {
      // Title card for this clip
      renderFrame(ctx, clip.url.split('/').pop()||'Clip', `출처: ${clip.url}`, done+1, totalSections);
      await new Promise(r=>setTimeout(r,800));

      for (const s of secs) {
        done++;
        const pct = Math.floor(90*done/totalSections);
        setProgress(pct, `[${done}/${totalSections}] ${s.title.substring(0,30)}`);
        log(`🎬 [${done}/${totalSections}] ${s.title.substring(0,30)}`, 'i');
        renderFrame(ctx, s.title, s.body, done, totalSections);
        await speakText(`${s.title}. ${s.body}`, voice);
      }
    }

    renderFrame(ctx, '완료', `Helena Studio · ${S.clips.length}클립·${totalSections}섹션 이어붙이기`, totalSections, totalSections);
    await new Promise(r=>setTimeout(r,2000));
    rec.stop();

    await new Promise(resolve => { rec.onstop = () => {
      S.resultBlob = new Blob(chunks,{type:'video/webm'});
      S.resultUrl = URL.createObjectURL(S.resultBlob);
      resolve();
    }});

    setProgress(100, '이어붙이기 완료!');
    log(`✅ ${S.clips.length}클립 → ${(S.resultBlob.size/1024/1024).toFixed(1)}MB`, 'ok');
    showPreview(totalSections);

  } catch(e) { log(`❌ ${e.message}`, 'err'); setProgress(0, e.message); }

  btn.disabled = false; btn.textContent = `영상 이어붙이기 (${S.clips.length}개 클립)`;
}

// ── SHARED ──
function showPreview(n) {
  document.getElementById('previewVideo').src = S.resultUrl;
  document.getElementById('previewSection').classList.remove('hidden');
  document.getElementById('previewInfo').textContent =
    `${n}섹션 · ${(S.resultBlob.size/1024/1024).toFixed(1)}MB`;
}

function downloadVideo() {
  if (!S.resultBlob) return;
  const a = document.createElement('a');
  a.href = S.resultUrl; a.download = 'helena-studio.webm'; a.click();
}
</script>
</body>
</html>
