<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="웹페이지 URL만 넣으면 Edge TTS + Playwright 스크린샷 → MP4 영상 자동 생성">
<title>Helena Studio — 웹페이지→영상 변환기</title>
<link rel="manifest" href="manifest.json">
<style>
:root { --bg:#0f172a; --surface:#1e293b; --border:#334155; --text:#e2e8f0;
  --muted:#64748b; --accent:#6366f1; --accent2:#818cf8; --gold:#f59e0b; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; }
.hidden { display:none !important; }

/* 헤더 */
.header { text-align:center; padding:2rem 1rem 1rem; }
.header h1 { font-size:1.6rem; font-weight:800; }
.header h1 span { color:var(--accent2); }
.header p { color:var(--muted); font-size:.85rem; margin-top:.25rem; }

/* 메인 카드 */
.card { background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:1.5rem; margin:0 1rem 1rem; max-width:600px; margin-left:auto; margin-right:auto; }
.card h2 { font-size:1rem; margin-bottom:1rem; display:flex; align-items:center; gap:.5rem; }
.step-num { background:var(--accent); color:#fff; width:24px; height:24px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:.75rem; font-weight:700; flex-shrink:0; }

/* 입력 */
.input-row { display:flex; gap:.5rem; }
input, select { flex:1; background:var(--bg); border:1px solid var(--border);
  color:var(--text); padding:.75rem; border-radius:8px; font-size:.9rem; }
input:focus, select:focus { border-color:var(--accent2); outline:none; }
select { flex:0 0 auto; min-width:120px; }

/* 버튼 */
.btn { padding:.75rem 1.5rem; border:none; border-radius:10px; cursor:pointer;
  font-size:.9rem; font-weight:700; transition:all .2s; width:100%; }
.btn:active { transform:scale(.98); }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:disabled { opacity:.4; cursor:default; }
.btn-outline { background:transparent; color:var(--accent2); border:1px solid var(--accent2); width:auto; }

/* 진행 */
.progress-section { margin:0 1rem 1rem; max-width:600px; margin-left:auto; margin-right:auto; }
.progress-bar { height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
.progress-fill { height:100%; background:var(--accent); width:0%; transition:width .3s; }
.progress-text { font-size:.8rem; color:var(--muted); margin-top:.25rem; }

/* 미리보기 */
.preview { margin:0 1rem 1rem; max-width:600px; margin-left:auto; margin-right:auto;
  background:var(--surface); border-radius:12px; overflow:hidden; border:1px solid var(--border); }
.preview video { width:100%; display:block; }
.preview .info { padding:.75rem; font-size:.8rem; color:var(--muted); display:flex;
  justify-content:space-between; }

/* 로그 */
.log { margin:0 1rem 2rem; max-width:600px; margin-left:auto; margin-right:auto;
  font-size:.75rem; color:var(--muted); max-height:200px; overflow-y:auto; }
.log .ok { color:#4ade80; }
.log .err { color:#f87171; }
.log .info { color:#60a5fa; }

/* Voice selector */
.voice-grid { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin-top:.5rem; }
.voice-btn { padding:.5rem; border:1px solid var(--border); border-radius:8px;
  background:var(--bg); color:var(--text); cursor:pointer; text-align:left; font-size:.8rem; }
.voice-btn.active { border-color:var(--accent2); background:#1e1a3a; }
.voice-btn .name { font-weight:600; }
.voice-btn .desc { font-size:.7rem; color:var(--muted); }

/* 탭 */
.tabs { display:flex; gap:.25rem; margin:0 1rem; max-width:600px; margin-left:auto; margin-right:auto; }
.tab { flex:1; padding:.6rem; text-align:center; cursor:pointer; border-radius:8px 8px 0 0;
  font-size:.8rem; font-weight:600; background:var(--surface); color:var(--muted);
  border:1px solid var(--border); border-bottom:none; }
.tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
</style>
</head>
<body>

<div class="header">
  <h1>🎬 Helena <span>Studio</span></h1>
  <p>웹페이지 → 영상 변환 · S21 단독 · 0원</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('url')">🌐 URL 입력</button>
  <button class="tab" onclick="switchTab('text')">✏️ 직접 작성</button>
</div>

<!-- URL 모드 -->
<div id="tab-url" class="card">
  <h2><span class="step-num">1</span> 웹페이지 URL</h2>
  <div class="input-row">
    <input type="url" id="urlInput" placeholder="https://helena751107.github.io/helena-piano/"
           value="https://helena751107.github.io/helena-piano/">
  </div>
</div>

<!-- 텍스트 모드 -->
<div id="tab-text" class="card hidden">
  <h2><span class="step-num">1</span> 내용 직접 입력</h2>
  <textarea id="textInput" rows="6" style="width:100%;background:var(--bg);border:1px solid var(--border);
    color:var(--text);padding:.75rem;border-radius:8px;font-size:.85rem;resize:vertical;"
    placeholder="제목&#10;=&#10;본문 내용을 여기에...&#10;&#10;## 섹션 제목&#10;섹션 본문..."></textarea>
</div>

<div class="card">
  <h2><span class="step-num">2</span> TTS 음성</h2>
  <div class="voice-grid" id="voiceGrid"></div>
</div>

<div class="card">
  <h2><span class="step-num">3</span> 생성</h2>
  <button class="btn btn-primary" id="generateBtn" onclick="generate()">🎬 영상 생성</button>
</div>

<div class="progress-section hidden" id="progressSection">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">준비 중...</div>
</div>

<div class="log" id="log"></div>

<div class="preview hidden" id="previewSection">
  <video id="previewVideo" controls></video>
  <div class="info">
    <span id="previewInfo"></span>
    <button class="btn btn-outline" onclick="downloadVideo()">📥 다운로드</button>
  </div>
</div>

<script>
// ── STATE ──
const state = { mode:'url', voice:null, voices:[], resultBlob:null, resultUrl:null };

// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
  loadVoices();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
});

function switchTab(mode) {
  state.mode = mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', false));
  document.querySelectorAll('.tab').forEach(t => { if (t.textContent.includes(mode==='url'?'URL':'직접')) t.classList.add('active'); });
  document.getElementById('tab-url').classList.toggle('hidden', mode !== 'url');
  document.getElementById('tab-text').classList.toggle('hidden', mode !== 'text');
}

function loadVoices() {
  const synth = window.speechSynthesis;
  // 한국어 음성만
  const load = () => {
    state.voices = synth.getVoices().filter(v => v.lang.startsWith('ko'));
    if (!state.voices.length) {
      // fallback: anything available
      state.voices = synth.getVoices();
    }
    renderVoices();
    if (state.voices.length) state.voice = state.voices[0];
  };
  load();
  synth.onvoiceschanged = load;
}

function renderVoices() {
  const grid = document.getElementById('voiceGrid');
  if (!state.voices.length) {
    grid.innerHTML = '<span style="color:var(--muted);font-size:.8rem">TTS 음성 로드 중... Chrome 권장</span>';
    return;
  }
  grid.innerHTML = state.voices.map((v,i) => `
    <button class="voice-btn${i===0?' active':''}" onclick="selectVoice(${i})" id="voice${i}">
      <div class="name">${v.name}</div>
      <div class="desc">${v.lang} · ${v.localService?'온디바이스':'네트워크'}</div>
    </button>`).join('');
}

function selectVoice(i) {
  state.voice = state.voices[i];
  document.querySelectorAll('.voice-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('voice'+i).classList.add('active');
}

// ── LOGGING ──
function log(msg, cls='') {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  el.innerHTML += `<div class="${cls}">[${t}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// ── MAIN PIPELINE ──
async function generate() {
  const btn = document.getElementById('generateBtn');
  btn.disabled = true; btn.textContent = '⏳ 생성 중...';

  const progress = document.getElementById('progressSection');
  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');
  progress.classList.remove('hidden');
  document.getElementById('previewSection').classList.add('hidden');
  document.getElementById('log').innerHTML = '';

  try {
    // Step 1: Get content
    setProgress(5, '콘텐츠 가져오는 중...');
    let content;
    if (state.mode === 'url') {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) throw new Error('URL을 입력하세요');
      log(`🌐 ${url}`, 'info');
      const html = await fetch(url).then(r => r.text());
      content = extractContent(html);
    } else {
      content = document.getElementById('textInput').value.trim();
      if (!content) throw new Error('내용을 입력하세요');
    }
    log(`📝 ${content.length}자 추출`, 'ok');

    // Step 2: Split into sections
    setProgress(10, '섹션 분할...');
    const sections = splitSections(content);
    log(`✂️ ${sections.length}개 섹션`, 'ok');

    // Step 3: Render frames + TTS
    const canvas = document.createElement('canvas');
    canvas.width = 720; canvas.height = 1280;
    const ctx = canvas.getContext('2d');

    const canvasStream = canvas.captureStream(30);
    const audioCtx = new AudioContext();
    const audioDest = audioCtx.createMediaStreamDestination();

    const chunks = [];
    const recorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp9' });
    recorder.ondataavailable = e => chunks.push(e.data);

    recorder.start();

    for (let i = 0; i < sections.length; i++) {
      const sec = sections[i];
      const pct = 10 + Math.floor(80 * (i+1) / sections.length);
      setProgress(pct, `[${i+1}/${sections.length}] ${sec.title.substring(0,40)}...`);
      log(`🎬 [${i+1}/${sections.length}] ${sec.title.substring(0,40)}`, 'info');

      // Render frame
      renderFrame(ctx, sec.title, sec.body, i+1, sections.length);

      // TTS
      const ttsText = `${sec.title}. ${sec.body}`;
      await speakText(ttsText, state.voice, audioCtx, audioDest, canvasStream);
    }

    // Final frame
    renderFrame(ctx, 'END', `Helena Studio · 총 ${sections.length}섹션`, sections.length, sections.length);
    await new Promise(r => setTimeout(r, 1500));

    recorder.stop();

    await new Promise(resolve => {
      recorder.onstop = () => {
        state.resultBlob = new Blob(chunks, { type: 'video/webm' });
        state.resultUrl = URL.createObjectURL(state.resultBlob);
        resolve();
      };
    });

    setProgress(100, '완료!');
    log(`✅ 완료! ${(state.resultBlob.size/1024/1024).toFixed(1)}MB`, 'ok');

    // Show preview
    const preview = document.getElementById('previewVideo');
    preview.src = state.resultUrl;
    document.getElementById('previewSection').classList.remove('hidden');
    document.getElementById('previewInfo').textContent =
      `${sections.length}섹션 · ${(state.resultBlob.size/1024/1024).toFixed(1)}MB`;

  } catch(e) {
    log(`❌ ${e.message}`, 'err');
    setProgress(0, e.message);
  }

  btn.disabled = false; btn.textContent = '🎬 영상 생성';
}

// ── HELPERS ──

function extractContent(html) {
  // Remove scripts/styles, get text
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('script,style,nav,footer,code,pre').forEach(e => e.remove());
  return div.textContent || '';
}

function splitSections(text) {
  const clean = text.replace(/\s+/g, ' ').trim();
  const sections = [];

  // Try to split by headings (##, # patterns)
  const headingSplit = clean.split(/(?:^|\n)\s*#{1,3}\s+(.+?)(?:\n|$)/);
  if (headingSplit.length > 1) {
    for (let i = 1; i < headingSplit.length; i += 2) {
      const title = headingSplit[i].trim();
      const body = (headingSplit[i+1] || '').trim();
      if (body.length > 5) {
        sections.push({ title, body: body.substring(0, 500) });
      }
    }
  }

  if (!sections.length) {
    // Fallback: chunk by sentences
    const sentences = clean.split(/[.。!?！？\n]+/).filter(s => s.trim().length > 5);
    const chunkSize = 3;
    for (let i = 0; i < Math.min(sentences.length, 18); i += chunkSize) {
      const chunk = sentences.slice(i, i+chunkSize).join('. ');
      sections.push({
        title: `Part ${Math.floor(i/chunkSize)+1}`,
        body: chunk.substring(0, 500)
      });
    }
  }

  // Limit: max 12 sections for reasonable video length
  return sections.slice(0, 12);
}

function renderFrame(ctx, title, body, num, total) {
  const W = 720, H = 1280;
  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f172a');
  grad.addColorStop(0.5, '#1e1a3a');
  grad.addColorStop(1, '#0f172a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Progress bar
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(50, H-50, W-100, 3);
  ctx.fillStyle = '#6366f1';
  ctx.fillRect(50, H-50, (W-100) * num/total, 3);

  // Logo
  ctx.fillStyle = '#475569';
  ctx.font = '12px system-ui';
  ctx.fillText('HELENA STUDIO', W-160, 50);

  // Section number
  ctx.fillStyle = '#6366f1';
  ctx.font = '14px system-ui';
  ctx.fillText(`SECTION ${num} / ${total}`, 50, 130);

  // Title
  ctx.fillStyle = '#f8fafc';
  ctx.font = 'bold 36px system-ui';
  const titleLines = wrapText(ctx, title, W-100);
  titleLines.forEach((line, i) => {
    ctx.fillText(line, 50, 200 + i*50);
  });

  // Body
  ctx.fillStyle = '#cbd5e1';
  ctx.font = '22px system-ui';
  const bodyLines = wrapText(ctx, body, W-100);
  const startY = 200 + titleLines.length*50 + 60;
  bodyLines.slice(0, 12).forEach((line, i) => {
    if (startY + i*36 < H-100) {
      ctx.fillText(line, 50, startY + i*36);
    }
  });

  // Decorative line
  ctx.strokeStyle = '#6366f1';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(50, 170 + titleLines.length*50);
  ctx.lineTo(W-50, 170 + titleLines.length*50);
  ctx.stroke();
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function speakText(text, voice, audioCtx, audioDest, canvasStream) {
  return new Promise(resolve => {
    if (!window.speechSynthesis) {
      // Fallback: silent duration based on text length
      const dur = text.length * 0.06 * 1000; // ~60ms per char
      setTimeout(resolve, dur);
      return;
    }

    const utterance = new SpeechSynthesisUtterance(text);
    if (voice) utterance.voice = voice;
    utterance.rate = 0.95;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;

    utterance.onend = () => resolve();
    utterance.onerror = () => resolve(); // Don't fail on TTS error

    window.speechSynthesis.speak(utterance);
  });
}

function setProgress(pct, msg) {
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressText').textContent = msg;
}

function downloadVideo() {
  if (!state.resultBlob) return;
  const a = document.createElement('a');
  a.href = state.resultUrl;
  a.download = 'helena-studio-video.webm';
  a.click();
}
</script>
</body>
</html>
